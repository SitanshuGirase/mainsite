<title>The Photon Academy — Admin</title>
<style>
:root{
  --bg:#0a101d;--panel:#101a2e;--panel2:#15213a;--line:#24365a;--line2:#1a2a48;
  --text:#eaf2ff;--muted:#9fb0cc;--cyan:#54d6e8;--cyan-d:#2bb4c8;--rose:#ed6d80;--green:#5ed9a0;--amber:#f0b429;
  --r:12px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 80% -10%,rgba(84,214,232,.08),transparent 60%),var(--bg);line-height:1.5}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
a{color:var(--cyan)}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13.5px}
.err{color:#ff9aa8}
.pad{padding:22px}

/* ---------- controls ---------- */
input,textarea,select,button{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=url],input[type=password],input[type=number],textarea,select{
  width:100%;background:#0a1324;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(84,214,232,.16)}
textarea{min-height:88px;resize:vertical}
input:not([type]),input[type=search],input[type=date],input[type=time],input[type=datetime-local],input[type=tel]{width:100%;background:#0a1324;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=date],input[type=time],input[type=datetime-local],select{color-scheme:dark}
input[type=checkbox]{width:auto;accent-color:var(--cyan)}
input::placeholder,textarea::placeholder{color:#6f84a8}
input[type=color]{width:54px;height:40px;padding:3px;background:#0a1324;border:1px solid var(--line);border-radius:9px;cursor:pointer}
label.lbl{display:block;font-size:13px;font-weight:600;color:#c9d6ec;margin-bottom:6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:9px 16px;font-weight:650;font-size:14px;cursor:pointer;background:var(--panel2);color:var(--text);transition:transform .12s,background .15s,border-color .15s,opacity .15s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--cyan);color:#06111f}
.btn.primary:hover{background:#7ae4f2}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.danger{background:var(--rose);color:#1a0509}
.btn.danger-ghost{background:transparent;border-color:rgba(237,109,128,.45);color:#ff9aa8}
.btn.danger-ghost:hover{background:rgba(237,109,128,.12)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.icon{padding:6px 10px;min-width:34px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-card h1{font-size:24px;margin:14px 0 6px}
.login-card .stack{display:grid;gap:12px;margin-top:20px}
.notice{margin-top:16px;padding:10px 12px;border-radius:9px;background:#122745;color:#cfe4ff;font-size:14px}
.notice.bad{background:#3a1622;color:#ffc2cc}
.logo{width:46px;height:46px;border-radius:50%;object-fit:contain;background:transparent;display:block;flex-shrink:0}
.login-card .logo{width:72px;height:72px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand b{display:block;font-size:15px}.brand span{font-size:11.5px;color:var(--cyan);letter-spacing:.12em}
.nav-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6f83a8;margin:18px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#c8d6ee;text-decoration:none;font-size:14.5px;cursor:pointer}
.nav a:hover{background:rgba(84,214,232,.07)}
.nav a.on{background:rgba(84,214,232,.14);color:#fff;font-weight:650}
.nav a i{font-style:normal;width:22px;text-align:center}
.side-foot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid var(--line2);font-size:13px}
.side-foot .who{color:var(--muted);word-break:break-all;margin-bottom:10px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(10,16,29,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.topbar h1{font-size:20px;flex:1}
#menu-btn{display:none}
.view{padding:26px;max-width:1080px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px;justify-content:space-between;margin-bottom:20px}
.page-head p{margin-top:6px;max-width:640px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:6px}

/* ---------- list items ---------- */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;transition:border-color .15s}
.item:hover{border-color:var(--line)}
.item.dim{opacity:.62}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;background:#0a1324;display:grid;place-items:center}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb-ph{width:100%;height:100%;display:grid;place-items:center;font-size:28px;background:#12203b;color:var(--cyan);font-weight:700}
.meta{display:grid;gap:3px;min-width:0}
.meta strong{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:#1c2d4d;color:#b7c8e6}
.badge.ok{background:rgba(94,217,160,.16);color:var(--green)}
.badge.warn{background:rgba(240,180,41,.16);color:var(--amber)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:14px}

/* ---------- dialog editor ---------- */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 40px 100px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(3,7,16,.72);backdrop-filter:blur(3px)}
#confirm{width:min(420px,calc(100vw - 24px));padding:24px}
#confirm h3{margin-bottom:8px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel);z-index:2}
.dlg-head h2{font-size:18px}
.dlg-body{padding:20px 22px;overflow:auto;max-height:calc(100vh - 150px);display:grid;gap:16px}
.dlg-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:var(--panel)}
.row-end{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--cyan)}
details.hi{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:#0d1729}
details.hi summary{cursor:pointer;font-weight:650;color:#c9d6ec}
details.hi .in{display:grid;gap:14px;margin-top:14px}

/* file / media boxes */
.filebox{border:1px dashed var(--line);border-radius:11px;padding:12px;background:#0d1729;display:grid;gap:10px}
.fpreview img,.fpreview video{max-width:100%;max-height:220px;border-radius:9px;display:block;background:#050a14}
.filelink{display:inline-block;padding:8px 12px;border-radius:8px;background:#12203b;text-decoration:none;font-weight:600}
.fbtns{display:flex;gap:8px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mtile{position:relative;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#050a14}
.mtile img,.mtile video{width:100%;height:110px;object-fit:cover;display:block}
.mtile .mbar{display:flex;justify-content:space-between;gap:4px;padding:5px;background:#0d1729}
.mtile .tag{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:99px}
.prog{height:6px;border-radius:99px;background:#16233f;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}

/* ---------- site text ---------- */
.tgroup{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);margin-bottom:10px}
.tgroup>summary{cursor:pointer;padding:14px 18px;font-weight:650;display:flex;justify-content:space-between;list-style:none}
.tgroup>summary::-webkit-details-marker{display:none}
.tgroup>summary span{color:var(--muted);font-weight:500;font-size:13px}
.tgroup .tbody{padding:4px 18px 18px;display:grid;gap:16px}
.trow{border-top:1px solid var(--line2);padding-top:14px}
.trow .k{font-size:12px;color:#6f83a8;margin-bottom:8px;font-family:ui-monospace,monospace}
.trow textarea{min-height:64px}
.trow .tact{display:flex;gap:8px;margin-top:10px;align-items:center}
.pill-mod{font-size:11px;font-weight:700;color:var(--amber);background:rgba(240,180,41,.14);padding:2px 8px;border-radius:99px}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:block}
.stat:hover{border-color:var(--cyan)}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.imp{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
.imp:first-of-type{border-top:0}
.imp div{min-width:0}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:9999;max-width:min(420px,calc(100vw - 36px))}
.toast{padding:12px 16px;border-radius:11px;background:#123a2c;color:#c9f7e2;border:1px solid rgba(94,217,160,.4);box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:14px}
.toast.err{background:#3a1622;color:#ffc2cc;border-color:rgba(237,109,128,.5)}
.toast.info{background:#122745;color:#cfe4ff;border-color:rgba(84,214,232,.4)}
code.raw{display:block;word-break:break-all;background:#050a14;padding:12px;border-radius:9px;margin:12px 0}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:50;transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  #menu-btn{display:inline-flex}
  .topbar{padding:12px 16px}.view{padding:16px}
  .item{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .two{grid-template-columns:1fr}
}

/* ---------- new pages: section builder ---------- */
.blk{border:1px solid var(--line);border-radius:12px;padding:14px;background:#0d1729;display:grid;gap:12px}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.blk-h b{font-size:14px;color:#c9d6ec}
.blk-h .acts{gap:6px}
.slugrow{display:flex;align-items:center;gap:8px}
.slugrow span{color:var(--muted);font-size:14px;white-space:nowrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.sec-h h3{font-size:15px}
/* forms builder + submissions */
.frow{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0d1729;display:grid;gap:10px}
.frow .top{display:grid;grid-template-columns:1fr 210px auto;gap:10px;align-items:end}
.frow .acts{display:flex;gap:6px}
.ans{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--line)}
.ans b{color:#c9d6ec;font-weight:600}
.sphotos{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.sphotos img{max-height:240px;max-width:100%;border-radius:12px;border:1px solid var(--line);display:block}
@media(max-width:700px){.frow .top{grid-template-columns:1fr}.ans{grid-template-columns:1fr}}
</style>

const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  const props = {};
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'muted') props[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  Object.assign(el, props);
  return el;
}
function toast(msg, kind = 'ok') {
  const t = h('div', { class: 'toast ' + (kind === 'ok' ? '' : kind) }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 7500 : 3200);
}
function friendly(e) {
  const m = (e && e.message) || String(e);
  if (/announcements_body_check/.test(m)) return 'Announcement text must be 50–5000 characters.';
  if (/announcements_title_check/.test(m)) return 'Title must be 5–160 characters.';
  if (/row-level security|permission denied/i.test(m)) return 'Permission denied — please sign in with an admin account.';
  if (/maximum allowed size|too large|Payload too large/i.test(m)) return 'A file is too large (max 50 MB).';
  if (/mime type/i.test(m)) return 'That file type is not allowed here.';
  return m;
}
function confirmBox(title, msg, okLabel = 'Delete', danger = true) {
  return new Promise(resolve => {
    const d = $('#confirm');
    let done = false;
    const finish = v => { if (done) return; done = true; d.close(); resolve(v); };
    d.replaceChildren(
      h('h3', {}, title), h('p', { class: 'muted' }, msg),
      h('div', { class: 'row-end' },
        h('button', { class: 'btn ghost', onclick: () => finish(false) }, 'Cancel'),
        h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => finish(true) }, okLabel)));
    d.onclose = () => finish(false);
    d.showModal();
  });
}
async function busy(btn, label, fn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}
const slugify = s => String(s || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) + '-' + Math.random().toString(36).slice(2, 6);
const extOf = f => ((f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin').slice(0, 6);

async function uploadFile(bucket, folder, file, onProgress) {
  if (file.size > 52428800) throw new Error(`“${file.name}” is larger than 50 MB.`);
  const path = `${folder}/${crypto.randomUUID()}.${extOf(file)}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert: false, contentType: file.type || undefined, cacheControl: '31536000' });
  if (error) throw error;
  if (onProgress) onProgress();
  return { path, url: sb.storage.from(bucket).getPublicUrl(path).data.publicUrl };
}
async function removeFiles(list) {
  const by = {};
  list.filter(x => x && x.path).forEach(x => { (by[x.bucket] = by[x.bucket] || []).push(x.path); });
  for (const [bucket, paths] of Object.entries(by)) { try { await sb.storage.from(bucket).remove(paths); } catch (e) { /* ignore */ } }
}
const pathFromUrl = (url, bucket) => { const m = String(url || '').split(`/object/public/${bucket}/`); return m[1] ? decodeURIComponent(m[1]) : null; };

const managedCache = new Set();
async function markManaged(name) {
  if (!name || managedCache.has(name)) return;
  const { error } = await sb.from('site_content').upsert({ key: 'managed.' + name, lang: '*', value: '1', updated_at: new Date().toISOString() }, { onConflict: 'key,lang' });
  if (error) throw error;
  managedCache.add(name);
}

function openEditor(cfg, row, rows, onDone) {
  const isNew = !row;

  const dlg = $('#dlg');
  const st = {};

  const hiBox = h('div', { class: 'in' });

  const fieldWrap = (f, control) => h('div', {}, f.type === 'switch' ? null : h('label', { class: 'lbl' }, f.label + (f.req ? ' *' : '')), control, f.hint && h('div', { class: 'hint' }, f.hint));

  function fileControl(f) {
    const s = st[f.k] = { file: null, remove: false };
    const preview = h('div', { class: 'fpreview' });
    const input = h('input', { type: 'file', accept: f.accept || 'image/*', class: 'hidden' });
    const pick = h('button', { type: 'button', class: 'btn ghost sm', onclick: () => input.click() }, 'Choose file');
    const rm = h('button', { type: 'button', class: 'btn danger-ghost sm', onclick: () => { s.file = null; s.remove = true; input.value = ''; draw(); } }, 'Remove');
    function draw() {
      preview.replaceChildren();
      const url = s.file ? URL.createObjectURL(s.file) : (s.remove ? null : base[f.urlK]);
      const mime = s.file ? s.file.type : (f.typeK ? (base[f.typeK] === 'video' ? 'video/x' : 'image/x') : (f.type === 'image' ? 'image/x' : 'file/x'));
      if (url) {
        if (mime.startsWith('image/')) preview.append(h('img', { src: url, alt: '' }));
        else if (mime.startsWith('video/')) preview.append(h('video', { src: url, controls: true }));
        else preview.append(h('a', { class: 'filelink', href: url, target: '_blank', rel: 'noopener' }, '📄 ' + (s.file ? s.file.name : 'Current file — open')));
      } else preview.append(h('span', { class: 'muted' }, 'Nothing uploaded yet'));
      rm.classList.toggle('hidden', !url);
      pick.textContent = url ? 'Replace file' : 'Choose file';
    }
    input.onchange = () => {
      const file = input.files[0]; if (!file) return;
      if (file.size > 52428800) { toast('That file is over 50 MB.', 'err'); input.value = ''; return; }
      s.file = file; s.remove = false; draw();
    };
    draw();
    return h('div', { class: 'filebox' }, preview, h('div', { class: 'fbtns' }, pick, rm, input));
  }

  cfg.fields.forEach(f => {

      ctl[f.k] = h('input', { type: 'checkbox', checked: base[f.k] !== false });
      control = h('label', { class: 'switch' }, ctl[f.k], f.label);
    } else if (f.type === 'color') control = ctl[f.k] = h('input', { type: 'color', value: base[f.k] || '#4fd6e8' });
    else control = ctl[f.k] = h('input', { type: f.type === 'url' ? 'url' : 'text', placeholder: f.ph || '', value: base[f.k] || '' });
    (f.hi ? hiBox : body).append(fieldWrap(f, control));
  });
  if (hiBox.children.length) body.append(h('details', { class: 'hi' }, h('summary', {}, 'Hindi version (optional)'), hiBox));

  const saveBtn = h('button', { type: 'submit', class: 'btn primary' }, isNew ? 'Add' : 'Save changes');
  const foot = h('div', { class: 'dlg-foot' },
    isNew ? h('span') : h('button', { type: 'button', class: 'btn danger-ghost', onclick: async () => { dlg.close(); await deleteRow(cfg, row, onDone); } }, 'Delete'),
    h('div', { style: 'display:flex;gap:10px' }, h('button', { type: 'button', class: 'btn ghost', onclick: () => dlg.close() }, 'Cancel'), saveBtn));
  const form = h('form', { onsubmit: async e => {
    e.preventDefault();
    await busy(saveBtn, 'Saving…', async () => {
      const uploaded = [];

   ==================================================================== */
let _imgs = null;
const _up = {};
async function siteImages() {
  if (_imgs) return _imgs;
  let res;
  try { res = await fetch('index.html', { cache: 'no-store' }); } catch (e) { throw new Error('Could not read index.html — host admin.html in the same folder as index.html.'); }
  if (!res.ok) throw new Error('Could not read index.html (HTTP ' + res.status + '). Host admin.html in the same folder as index.html.');
  const txt = await res.text();
  const m = txt.match(/const PHOTOS = \{([\s\S]*?)\n\s*\};/);
  if (!m) throw new Error('The photo block was not found in index.html.');
  const out = {}; const re = /(\w+):\s*"(data:image\/[a-z+]+;base64,[A-Za-z0-9+\/=]+)"/g; let x;
  while ((x = re.exec(m[1]))) out[x[1]] = x[2];
  if (!Object.keys(out).length) throw new Error('No embedded photos were found in index.html.');
  return (_imgs = out);
}
async function uploadBuiltIn(key) {
  if (_up[key]) return _up[key];
  const imgs = await siteImages();
  if (!imgs[key]) throw new Error('Missing built-in photo: ' + key);
  const blob = await (await fetch(imgs[key])).blob();
  const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
  return (_up[key] = await uploadFile('site-media', 'imported', new File([blob], key + '.' + ext, { type: blob.type })));
}
const IMPORTS = {
  faculty: { cfg: 'faculty', build: async () => { const out = []; for (const [i, f] of SEED.faculty.entries()) { const { img, ...rest } = f; const up = await uploadBuiltIn(img); out.push({ ...rest, photo_url: up.url, photo_path: null, sort_order: i * 10, published: true }); } return out; } },

  reel: { cfg: 'reel', build: async () => { const out = []; for (const [i, g] of SEED.reel.entries()) { const up = await uploadBuiltIn(g.img); out.push({ area: 'reel', media_url: up.url, media_path: null, media_type: 'image', title: g.title, caption: g.caption, sort_order: i * 10, published: true }); } return out; } },
  notes: { cfg: 'notes', build: async () => SEED.notes.map((n, i) => ({ ...n, sort_order: i * 10, published: true })) },
  testimonials: { cfg: 'testimonials', build: async () => SEED.testimonials.map((n, i) => ({ ...n, stars: 5, sort_order: i * 10, published: true })) },

};
async function countRows(cfg) {

async function renderText(view) {

        if (up.length) { const { error } = await sb.from('site_content').upsert(up, { onConflict: 'key,lang' }); if (error) throw error; }
        if (del.length) { const { error } = await sb.from('site_content').delete().eq('key', k).in('lang', del); if (error) throw error; }
        up.forEach(r => { ov[k + '|' + r.lang] = r.value; }); del.forEach(l => { delete ov[k + '|' + l]; });
        en.value = eff(k, 'en'); hi.value = eff(k, 'hi'); sync(); dirty(); toast('Saved ✓ — live on the website');

      if (error) return toast(friendly(error), 'err');
      delete ov[k + '|en']; delete ov[k + '|hi']; en.value = CATALOG.en[k]; hi.value = CATALOG.hi[k]; sync(); dirty(); toast('Restored the original text');
    };

    const el = h('div', { class: 'trow', 'data-search': (k + ' ' + CATALOG.en[k] + ' ' + CATALOG.hi[k]).toLowerCase() },

      h('div', { class: 'tact' }, save, reset));
    return el;
  }
  const search = h('input', { type: 'text', placeholder: 'Search any text on the site…  e.g. “fees”, “Naveen”, “JEE”' });

    const build = () => { if (built.has(g.label)) return; built.add(g.label); g.keys.forEach(k => body.append(row(k))); };

    return { d, build, body };

const RESERVED_SLUGS = [...Object.keys(PAGES), 'assistant', 'admin', 'index'];
const pageSlug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30).replace(/-+$/, '');
const blankBlock = () => ({ style: 'dark', eyebrow: '', title: '', body: '', image_url: null, image_path: null, cta_label: '', cta_url: '', eyebrow_hi: '', title_hi: '', body_hi: '', cta_label_hi: '' });

async function loadPages() {
  const { data, error } = await sb.from('site_content').select('key,value').eq('lang', '*').like('key', 'page.%');
  if (error) throw error;
  const out = [];
  (data || []).forEach(r => { try { const p = JSON.parse(r.value); if (p && Array.isArray(p.blocks)) { p.slug = r.key.slice(5); out.push(p); } } catch (e) { /* ignore an unreadable row */ } });
  return out.sort((a, b) => (a.sort || 0) - (b.sort || 0));
}
function writePage(p, isNew) {
  const { slug, ...rest } = p;
  const value = JSON.stringify(rest), updated_at = new Date().toISOString();
  return isNew
    ? sb.from('site_content').insert({ key: 'page.' + slug, lang: '*', value, updated_at })
    : sb.from('site_content').update({ value, updated_at }).eq('key', 'page.' + slug).eq('lang', '*');
}
const pageFiles = p => (p.blocks || []).filter(b => b.image_path).map(b => ({ bucket: 'site-media', path: b.image_path }));

async function deletePage(p, onDone) {
  if (!(await confirmBox(`Delete the page “${p.title}”?`, 'The page, its menu link and its uploaded pictures will be removed from the website. This can’t be undone.'))) return;
  const { error } = await sb.from('site_content').delete().eq('key', 'page.' + p.slug).eq('lang', '*');
  if (error) return toast(friendly(error), 'err');
  await removeFiles(pageFiles(p));
  toast('Page deleted');
  onDone();
}

    h('div', { class: 'sec-h' }, h('h3', {}, 'Sections'), h('button', { type: 'button', class: 'btn ghost sm', onclick: () => { blocks.push({ d: blankBlock(), file: null, remove: false }); drawBlocks(); } }, '＋ Add section')),

/* ---------- Timetable: whole week at once + changes for a day ---------- */
async function renderTimetable(view) {
  const S = window.__ttSel = window.__ttSel || { cls: '10', div: '' };
  const cls = h('select', {}, ...CLASSES.map(c => h('option', { value: c }, 'Class ' + c))); cls.value = S.cls;
  const div = h('select', {}, ...divOptions('All divisions')); div.value = S.div;
  const wk = h('div'), chg = h('div'), upc = h('div');
  const scopeQ = (q) => div.value ? q.eq('division', div.value) : q.is('division', null);
  const unionQ = (q) => div.value ? q.or('division.is.null,division.eq.' + div.value) : q.is('division', null);
  const scopeText = () => 'Class ' + cls.value + (div.value ? ' · Division ' + div.value : ' · all divisions');

  /* ===== A. weekly grid ===== */
  async function drawWeek() {
    S.cls = cls.value; S.div = div.value;
    const { data: rows, error } = await scopeQ(sb.from('class_timetable').select('*').eq('class_name', cls.value).order('start_time')).limit(400);
    if (error) { wk.replaceChildren(h('p', { class: 'err' }, 'Could not load this timetable.')); return; }
    const periods = [];  // each: { s, e, cells: {day: input} }
    const grid = h('div', { style: 'overflow-x:auto' });
    const table = h('table', { style: 'border-collapse:separate;border-spacing:6px;min-width:900px' });
    const addPeriod = (s, e, vals) => {
      const si = h('input', { type: 'time', style: 'width:150px' }); si.value = s || '';
      const ei = h('input', { type: 'time', style: 'width:150px' }); ei.value = e || '';
      const cells = {};
      const tr = h('tr', {}, h('td', {}, si), h('td', {}, ei));
      for (let d = 1; d <= 7; d++) { const c = h('input', { placeholder: 'Subject | Teacher | Room', style: 'min-width:150px' }); c.value = (vals && vals[d]) || ''; cells[d] = c; tr.append(h('td', {}, c)); }
      const rm = h('button', { type: 'button', class: 'btn danger sm', title: 'Remove this period', onclick: () => { tr.remove(); periods.splice(periods.indexOf(p), 1); } }, '×');
      tr.append(h('td', {}, rm));
      const p = { si, ei, cells }; periods.push(p); table.append(tr); return p;
    };
    const head = h('tr', {}, h('th', { class: 'muted' }, 'Starts'), h('th', { class: 'muted' }, 'Ends'), ...[1, 2, 3, 4, 5, 6, 7].map(d => h('th', { class: 'muted' }, DAYSHORT[d])), h('th'));
    table.append(head);
    const fill = (rowsIn) => {
      periods.splice(0).forEach(() => {}); [...table.querySelectorAll('tr')].slice(1).forEach(t => t.remove());
      const g = new Map();
      rowsIn.forEach(r => { const k = r.start_time.slice(0, 5) + '|' + r.end_time.slice(0, 5); if (!g.has(k)) g.set(k, {}); g.get(k)[r.weekday] = r.subject + (r.teacher || r.room ? ' | ' + (r.teacher || '') : '') + (r.room ? ' | ' + r.room : ''); });
      const keys = [...g.keys()].sort();
      if (!keys.length) addPeriod('', '', {});
      keys.forEach(k => { const [s, e] = k.split('|'); addPeriod(s, e, g.get(k)); });
    };
    fill(rows || []);
    grid.append(table);
    const addBtn = h('button', { type: 'button', class: 'btn ghost', onclick: () => { const last = periods[periods.length - 1]; addPeriod(last ? last.ei.value : '', '', {}); } }, '+ Add period');
    const paste = h('textarea', { rows: '5', placeholder: 'Paste rows from a spreadsheet, one class per line:\nMon, 09:00, 10:00, Maths, Mr Rao, Room 12\nTue, 10:15, 11:15, Science, Mrs Shah, Lab' });
    const pasteBtn = h('button', { type: 'button', class: 'btn ghost' }, 'Fill the grid from pasted rows');
    pasteBtn.onclick = () => {
      const DM = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 7 }, out = [], bad = [];
      paste.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
        const f = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
        const day = DM[(f[0] || '').slice(0, 3).toLowerCase()] || (/^[1-7]$/.test(f[0]) ? +f[0] : 0);
        const s = tparse(f[1]), e = tparse(f[2]), sub = f[3] || '';
        if (!day || !s || !e || e <= s || sub.length < 2) { bad.push(i + 1); return; }
        out.push({ weekday: day, start_time: s, end_time: e, subject: sub, teacher: f[4] || '', room: f[5] || '' });
      });
      if (bad.length) return toast('Check line' + (bad.length > 1 ? 's ' : ' ') + bad.slice(0, 6).join(', ') + ': needs day, start, end and subject.', 'err');
      if (!out.length) return toast('Nothing to import.', 'err');
      fill(out); toast(out.length + ' classes placed in the grid. Check them, then press Save week.');
    };
    const save = h('button', { type: 'button', class: 'btn primary' }, 'Save the whole week');
    save.onclick = () => busy(save, 'Saving…', async () => {
      const out = [];
      for (const p of periods) {
        const s = p.si.value, e = p.ei.value;
        for (let d = 1; d <= 7; d++) {
          const v = p.cells[d].value.trim(); if (!v) continue;
          const [sub, tea, room] = v.split('|').map(x => x.trim());
          if (!s || !e) return toast('Every period with classes needs a start and end time.', 'err');
          if (e <= s) return toast('A period ends before it starts (' + s + ').', 'err');
          if (!sub || sub.length < 2 || sub.length > 60) return toast('Subject names must be 2 to 60 letters.', 'err');
          if ((tea || '').length > 60 || (room || '').length > 30) return toast('Teacher or room name is too long.', 'err');
          out.push({ class_name: cls.value, division: div.value || null, weekday: d, start_time: s + ':00', end_time: e + ':00', subject: sub, teacher: tea || null, room: room || null });
        }
      }
      for (let d = 1; d <= 7; d++) { const day = out.filter(x => x.weekday === d).sort((a, b) => a.start_time.localeCompare(b.start_time)); for (let i = 1; i < day.length; i++) if (day[i].start_time < day[i - 1].end_time) return toast(DAYSHORT[d] + ': ' + day[i - 1].subject + ' and ' + day[i].subject + ' overlap.', 'err'); }
      if (!out.length && !await confirmBox('Clear this timetable?', scopeText() + ' has no classes in the grid. Saving will remove its whole timetable.', 'Clear it')) return;
      const { data: old } = await scopeQ(sb.from('class_timetable').select('id').eq('class_name', cls.value)).limit(500);
      if (out.length) { const { error: e1 } = await sb.from('class_timetable').insert(out); if (e1) return toast(friendly(e1), 'err'); }
      const ids = (old || []).map(x => x.id);
      if (ids.length) { const { error: e2 } = await sb.from('class_timetable').delete().in('id', ids); if (e2) return toast('Saved, but old rows could not be removed: ' + friendly(e2), 'err'); }
      toast('Timetable saved for ' + scopeText() + '.'); drawWeek(); drawChanges();
    });
    wk.replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Weekly timetable · ' + scopeText()),
      h('p', { class: 'muted' }, 'Type each cell as Subject | Teacher | Room (teacher and room are optional). Leave a cell empty for no class. Saving replaces this timetable. A division timetable is added to the "all divisions" one.'),
      grid, h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin:10px 0' }, addBtn, save),
      h('details', { style: 'margin-top:10px' }, h('summary', { class: 'muted', style: 'cursor:pointer' }, 'Paste a whole week from a spreadsheet'), uiFld('Rows', paste), pasteBtn)));
  }

  /* ===== B. changes for one day ===== */
  const dateIn = h('input', { type: 'date' }); dateIn.value = toDateInput(new Date());
  async function drawChanges() {
    const day = dateIn.value; if (!day) return;
    const wd = (new Date(day + 'T12:00:00').getDay() + 6) % 7 + 1;
    const { data: base } = await unionQ(sb.from('class_timetable').select('*').eq('class_name', cls.value).eq('weekday', wd).order('start_time')).limit(60);
    const { data: ch } = await scopeQ(sb.from('timetable_changes').select('*').eq('class_name', cls.value).eq('on_date', day)).limit(60);
    const { data: u } = await sb.auth.getUser(); const me = u && u.user ? u.user.id : null;
    const note = h('input', { maxlength: '200', placeholder: 'Optional note for students, e.g. Teacher on leave' });
    const insertChange = async (row) => { const { error } = await sb.from('timetable_changes').insert({ class_name: cls.value, division: div.value || null, on_date: day, created_by: me, ...row }); if (error) return toast(friendly(error), 'err'); toast('Saved. Students see it right away.'); drawChanges(); drawUpcoming(); };
    const undo = async (c) => { const { error } = await sb.from('timetable_changes').delete().eq('id', c.id); if (error) return toast(friendly(error), 'err'); toast('Change removed.'); drawChanges(); drawUpcoming(); };
    const timeForm = (init, label, onSave) => {
      const sub = h('input', { maxlength: '60', placeholder: 'Subject' }); sub.value = init.subject || '';
      const s = h('input', { type: 'time' }); s.value = (init.start_time || '').slice(0, 5);
      const e = h('input', { type: 'time' }); e.value = (init.end_time || '').slice(0, 5);
      const t = h('input', { maxlength: '60', placeholder: 'Teacher (optional)' }); t.value = init.teacher || '';
      const r = h('input', { maxlength: '30', placeholder: 'Room (optional)' }); r.value = init.room || '';
      const go = h('button', { type: 'button', class: 'btn primary sm' }, label);
      go.onclick = () => busy(go, 'Saving…', async () => {
        if (sub.value.trim().length < 2) return toast('Enter the subject.', 'err');
        if (!s.value || !e.value || e.value <= s.value) return toast('Pick a start time before the end time.', 'err');
        await onSave({ subject: sub.value.trim(), start_time: s.value + ':00', end_time: e.value + ':00', teacher: t.value.trim() || null, room: r.value.trim() || null, note: note.value.trim() || null });
      });
      return h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px' }, sub, s, e, t, r, go);
    };
    const slotRow = (b) => {
      const mine = (ch || []).filter(c => c.orig_start_time && c.orig_start_time.slice(0, 5) === b.start_time.slice(0, 5));
      const holder = h('div', { style: 'padding:10px 0;border-top:1px solid var(--line2)' });
      const line = h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center' },
        h('div', {}, h('b', {}, b.start_time.slice(0, 5) + '–' + b.end_time.slice(0, 5) + ' · ' + b.subject), h('span', { class: 'muted' }, [b.teacher, b.room ? 'Room ' + b.room : ''].filter(Boolean).length ? ' · ' + [b.teacher, b.room ? 'Room ' + b.room : ''].filter(Boolean).join(' · ') : ''),
          ...mine.map(c => h('div', { style: 'color:var(--amber)' }, (c.kind === 'cancelled' ? '✕ Cancelled' : '↻ Changed to ' + c.subject + ' ' + c.start_time.slice(0, 5) + '–' + c.end_time.slice(0, 5)) + (c.note ? ' · ' + c.note : '') + ' '), ...[])),
        h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
          ...mine.map(c => h('button', { type: 'button', class: 'btn ghost sm', onclick: () => undo(c) }, 'Undo')),
          !mine.length ? h('button', { type: 'button', class: 'btn danger sm', onclick: () => insertChange({ kind: 'cancelled', orig_start_time: b.start_time, subject: b.subject, note: note.value.trim() || null }) }, 'Cancel this class') : null,
          !mine.length ? h('button', { type: 'button', class: 'btn ghost sm', onclick: () => holder.append(timeForm(b, 'Save change', (v) => insertChange({ kind: 'changed', orig_start_time: b.start_time, ...v }))) }, 'Change it') : null));
      holder.append(line); return holder;
    };
    const extras = (ch || []).filter(c => c.kind === 'extra');
    chg.replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Change a day · ' + scopeText()),
      h('p', { class: 'muted' }, 'Cancel, change or add a class for one date only. The weekly timetable stays the same. Students see the change at once.'),
      uiFld('Date', dateIn), uiFld('Note for students (used by the next button you press)', note),
      h('h3', { style: 'margin:14px 0 4px;font-size:15px' }, 'Classes that day'),
      ...((base || []).length ? base.map(slotRow) : [h('p', { class: 'muted' }, 'No classes in the weekly timetable for this day.')]),
      ...extras.map(c => h('div', { style: 'padding:10px 0;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap' }, h('div', {}, h('b', {}, '＋ Extra: ' + c.start_time.slice(0, 5) + '–' + c.end_time.slice(0, 5) + ' · ' + c.subject), c.note ? h('span', { class: 'muted' }, ' · ' + c.note) : null), h('button', { type: 'button', class: 'btn ghost sm', onclick: () => undo(c) }, 'Remove'))),
      h('details', { style: 'margin-top:10px' }, h('summary', { style: 'cursor:pointer;color:var(--cyan)' }, '＋ Add an extra class this day'),
        timeForm({}, 'Add extra class', (v) => insertChange({ kind: 'extra', ...v })))));
  }
  async function drawUpcoming() {
    const { data } = await sb.from('timetable_changes').select('*').gte('on_date', toDateInput(new Date())).order('on_date').limit(100);
    upc.replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Upcoming changes (all classes)'),
      ...((data || []).length ? data.map(c => h('div', { style: 'padding:8px 0;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap' },
        h('div', {}, h('b', {}, new Date(c.on_date + 'T12:00:00').toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }) + ' · Class ' + c.class_name + (c.division ? c.division : '')),
          h('span', { class: 'muted' }, ' · ' + (c.kind === 'cancelled' ? 'Cancelled ' + (c.subject || '') : c.kind === 'changed' ? 'Changed to ' + c.subject + ' ' + c.start_time.slice(0, 5) : 'Extra ' + c.subject + ' ' + c.start_time.slice(0, 5)) + (c.note ? ' · ' + c.note : ''))),
        h('button', { type: 'button', class: 'btn ghost sm', onclick: async () => { const { error } = await sb.from('timetable_changes').delete().eq('id', c.id); if (error) return toast(friendly(error), 'err'); toast('Removed.'); drawChanges(); drawUpcoming(); } }, 'Remove'))) : [h('p', { class: 'muted' }, 'No upcoming changes.')])));
  }
  const reloadAll = () => { drawWeek(); drawChanges(); };
  cls.onchange = reloadAll; div.onchange = reloadAll; dateIn.onchange = drawChanges;
  view.replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Which class?'), h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px' }, uiFld('Class', cls), uiFld('Division', div))), wk, chg, upc);
  drawWeek(); drawChanges(); drawUpcoming();
}

/* ---------- Notes: special notes for a class or one student ---------- */
async function renderNotes(view) {
  const { data: stu } = await sb.from('profiles').select('id,display_name,class_name').eq('role', 'student').eq('student_status', 'approved').order('display_name');
  const { data: notes, error } = await sb.from('student_notes').select('*').order('pinned', { ascending: false }).order('created_at', { ascending: false }).limit(200);
  if (error) throw new Error('Could not load notes.');
  const reload = () => renderNotes(view);
  const names = new Map((stu || []).map(x => [x.id, x.display_name || 'Student']));
  const fld = (label, el) => h('label', { style: 'display:block;margin:8px 0' }, h('span', { class: 'muted' }, label), el);
  const who = h('select', {}, h('option', { value: 'class' }, 'Whole class'), h('option', { value: 'student' }, 'One student'));
  const cls = h('select', {}, ...['6', '7', '8', '9', '10', '11', '12'].map(c => h('option', { value: c }, 'Class ' + c)));
  const one = h('select', {}, ...(stu || []).map(x => h('option', { value: x.id }, (x.display_name || 'Student') + (x.class_name ? ' (Class ' + x.class_name + ')' : ''))));
  const clsRow = fld('Which class', cls), oneRow = fld('Which student', one);
  const sync = () => { clsRow.style.display = who.value === 'class' ? '' : 'none'; oneRow.style.display = who.value === 'student' ? '' : 'none'; };
  who.onchange = sync; sync();
  const title = h('input', { maxlength: '120', placeholder: 'e.g. Bring calculator on Friday' });
  const body = h('textarea', { maxlength: '2000', rows: '3', placeholder: 'Details (optional)' });
  const pin = h('input', { type: 'checkbox' });
  const add = h('button', { class: 'btn primary', type: 'button' }, 'Add note');
  add.onclick = () => busy(add, 'Adding…', async () => {
    if (title.value.trim().length < 2) return toast('Enter a title.', 'err');
    const row = { title: title.value.trim(), body: body.value.trim() || null, pinned: pin.checked };
    if (who.value === 'class') row.class_name = cls.value;
    else { if (!one.value) return toast('No approved student to choose.', 'err'); row.student_id = one.value; }
    const { data: u } = await sb.auth.getUser(); row.created_by = u && u.user ? u.user.id : null;
    const { error: e } = await sb.from('student_notes').insert(row);
    if (e) return toast(friendly(e), 'err');
    toast('Added.'); reload();
  });
  const del = async (n) => {
    if (!await confirmBox('Delete this note?', n.title, 'Delete')) return;
    const { error: e } = await sb.from('student_notes').delete().eq('id', n.id);
    if (e) return toast(friendly(e), 'err');
    toast('Deleted.'); reload();
  };
  const row = (n) => h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line2)' },
    h('div', {}, h('b', {}, (n.pinned ? '📌 ' : '') + n.title), h('div', { class: 'muted' }, (n.student_id ? 'For ' + (names.get(n.student_id) || 'one student') : 'Class ' + n.class_name) + ' · ' + new Date(n.created_at).toLocaleDateString()),
      n.body ? h('div', { class: 'muted' }, n.body) : null),
    h('button', { class: 'btn danger sm', onclick: () => del(n) }, 'Delete'));
  view.replaceChildren(
    h('div', { class: 'card' }, h('h2', {}, 'Add a special note'), h('p', { class: 'muted' }, 'Shown in the Special notes section of Student Space. Students see only notes for their class or addressed to them.'),
      fld('For', who), clsRow, oneRow, fld('Title', title), fld('Details', body), h('label', { style: 'display:flex;gap:8px;align-items:center;margin:8px 0' }, pin, h('span', {}, 'Pin to the top')), add),
    h('div', { class: 'card' }, h('h2', {}, 'Notes (' + (notes || []).length + ')'), ...((notes || []).length ? notes.map(row) : [h('p', { class: 'muted' }, 'No notes yet.')])));
}


/* ---------- Teachers: who teaches which class ---------- */
async function renderTeachers(view) {
  const { data: r, error } = await sb.functions.invoke('manage-students', { body: { action: 'list_teachers' } });
  if (error || !r || !r.teachers) throw new Error('Could not load teachers.');
  const { data: tcs } = await sb.from('teacher_classes').select('*').order('class_name');
  const reload = () => renderTeachers(view);
  const byT = new Map(); (tcs || []).forEach(x => { if (!byT.has(x.teacher_id)) byT.set(x.teacher_id, []); byT.get(x.teacher_id).push(x); });
  const card = (t) => {
    const list = (byT.get(t.id) || []).sort((x, y) => Number(x.class_name) - Number(y.class_name) || (x.division || '').localeCompare(y.division || ''));
    const cls = h('select', {}, ...CLASSES.map(c => h('option', { value: c }, 'Class ' + c)));
    const div = h('select', {}, ...divOptions('All divisions'));
    const add = h('button', { type: 'button', class: 'btn primary sm' }, 'Add class');
    add.onclick = () => busy(add, 'Adding…', async () => {
      const { error: e } = await sb.from('teacher_classes').insert({ teacher_id: t.id, class_name: cls.value, division: div.value || null });
      if (e) return toast(/duplicate|unique/i.test(e.message || '') ? 'They already have that class.' : friendly(e), 'err');
      toast('Class added.'); reload();
    });
    const chip = (x) => h('span', { style: 'display:inline-flex;gap:6px;align-items:center;padding:4px 10px;margin:3px 6px 3px 0;border-radius:99px;background:rgba(79,214,232,.14);border:1px solid rgba(79,214,232,.4)' },
      'Class ' + x.class_name + (x.division ? ' · Division ' + x.division : ' · all divisions'),
      h('button', { type: 'button', title: 'Remove', style: 'background:none;border:0;color:#ff8a8a;cursor:pointer;font-size:16px;padding:0', onclick: async () => { const { error: e } = await sb.from('teacher_classes').delete().eq('id', x.id); if (e) return toast(friendly(e), 'err'); reload(); } }, '×'));
    const drop = async () => {
      if (!await confirmBox('Remove teacher role?', (t.display_name || 'This person') + ' goes back to being a student account waiting for approval, and loses all their classes.', 'Remove role')) return;
      await sb.from('teacher_classes').delete().eq('teacher_id', t.id);
      const { error: e } = await sb.from('profiles').update({ role: 'student', student_status: 'pending' }).eq('id', t.id).eq('role', 'teacher');
      if (e) return toast(friendly(e), 'err');
      toast('Teacher role removed.'); reload();
    };
    return h('div', { class: 'card' }, h('h2', {}, t.display_name || '(no name)'), h('p', { class: 'muted' }, t.email || 'no email'),
      h('div', {}, ...(list.length ? list.map(chip) : [h('p', { class: 'muted' }, 'No classes yet. A teacher with no classes sees nothing.')])),
      h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px' }, cls, div, add),
      h('div', { style: 'margin-top:12px' }, h('button', { type: 'button', class: 'btn danger sm', onclick: drop }, 'Remove teacher role')));
  };
  view.replaceChildren(
    h('div', { class: 'card' }, h('h2', {}, 'How to add a teacher'),
      h('p', { class: 'muted' }, '1) The teacher opens Student Space on the website and signs in with Google once. 2) In the Students tab, press "Make teacher" next to their name. 3) Come here and give them their classes. A teacher can see the students of their classes, assign homework, tests and notes there, and change a single day of the timetable. They cannot approve students, see forms, or open this admin panel.')),
    ...(r.teachers.length ? r.teachers.map(card) : [h('p', { class: 'muted' }, 'No teachers yet.')]));
}

/* ====================================================================
   Shell: navigation, routing, auth
   ==================================================================== */
const NAV = [
  ['Start', [['home', '🏠', 'Overview', renderOverview]]],
  ['Content', [['announcements', '📣', 'Announcements', renderAnnouncements], ['notes', '📚', 'Notes & PDFs'], ['faculty', '🧑‍🏫', 'Faculty'], ['gallery', '🖼️', 'Gallery'], ['reel', '🎞️', 'Video tour slideshow'], ['testimonials', '💬', 'Testimonials'], ['faqs', '❓', 'FAQ'], ['quotes', '✨', 'Quotes']]],
  ['Pages', [['pages', '📄', 'New pages', renderPages], ['headerbtns', '🔘', 'Header buttons', renderHeaderButtons], ['forms', '📝', 'Forms', renderForms], ['submissions', '📥', 'Form submissions', renderSubmissions], ['sections', '🧩', 'New sections'], ['text', '✏️', 'Site text', renderText], ['images', '🖼️', 'Site images', renderImages]]],
  ['Students', [['students', '🎓', 'Students', renderStudents], ['schedule', '📅', 'Schedule', renderSchedule], ['timetable', '🗓️', 'Timetable', renderTimetable], ['notes', '📌', 'Notes', renderNotes], ['teachers', '🧑‍🏫', 'Teachers', renderTeachers]]],
  ['Settings', [['keys', '🔑', 'API keys & AI', renderKeys]]]
];
const ROUTES = {};
NAV.forEach(([, items]) => items.forEach(([id, icon, label, fn]) => { ROUTES[id] = { id, icon, label, render: fn || (v => renderCollection(id, v)) }; }));

function buildNav() {
  const nav = $('#nav'); nav.replaceChildren();
  NAV.forEach(([head, items]) => {
    nav.append(h('div', { class: 'nav-h' }, head));
    items.forEach(([id, icon, label]) => nav.append(h('a', { href: '#/' + id, 'data-id': id, onclick: () => $('#side').classList.remove('open') }, h('i', {}, icon), label)));
  });
}
async function route() {
  const id = (location.hash.match(/^#\/(\w+)/) || [])[1] || 'home';
  const r = ROUTES[id] || ROUTES.home;
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === r.id));
  $('#page-title').textContent = r.label;
  const view = $('#view');
  view.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
  try { await r.render(view); } catch (e) { view.replaceChildren(h('p', { class: 'err' }, friendly(e))); }
  window.scrollTo({ top: 0 });
}

function showLogin(msg, bad) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  const note = $('#login-note'); if (msg) note.textContent = msg; note.classList.toggle('bad', !!bad);
  $('#login-signout').classList.toggle('hidden', !bad);
}
let started = false;
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin('Enter your admin email to continue.', false);
  const { data, error } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  if (error || !data || data.role !== 'admin') return showLogin('Not authorised — ' + session.user.email + ' is not an admin account.', true);
  if (started) return;
  started = true; currentUser = session.user;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = session.user.email;
  buildNav(); route();
}
window.addEventListener('hashchange', () => { if (started) route(); });
$('#menu-btn').onclick = () => $('#side').classList.toggle('open');
if (/[?&]magic=1/.test(location.search)) { $('#email').classList.remove('hidden'); $('#send-link').classList.remove('hidden'); }
$('#google-login').onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0], queryParams: { prompt: 'select_account' } } });
  if (error) showLogin('Google sign-in is not available right now.', true);
};
$('#send-link').onclick = async e => {
  try {
    const email = $('#email').value.trim(); if (!email) throw new Error('Enter your email address.');
    await busy(e.target, 'Sending…', async () => { const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } }); if (error) throw error; });
    showLogin('Magic link sent — open it in this browser.', false);
  } catch (err) { showLogin(friendly(err), true); $('#login-signout').classList.add('hidden'); }
};
const signOut = async () => { await sb.auth.signOut(); location.hash = ''; location.reload(); };
$('#sign-out').onclick = signOut; $('#login-signout').onclick = signOut;
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' || ev === 'TOKEN_REFRESHED') setTimeout(boot, 0); });
boot();
})();

</script>
